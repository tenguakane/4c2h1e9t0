<style>
/* Layout: one phone-width column, sticky header, fixed bottom tab bar; money in mono, headings in Unbounded */
:root{
  /* palette: light accent / soft / ink, dark accent / soft / ink */
  --a-l:#14705A; --as-l:#D8EEE6; --ai-l:#FFFFFF; --a-d:#3DB48E; --as-d:#163A2F; --ai-d:#06130E;
  --f-l:#B9770F; --fs-l:#FBEACB; --f-d:#E8AA45; --fs-d:#3A2B12;
  --bg:color-mix(in srgb,var(--a-l) 6%,#EDF0F1); --surface:#FFFFFF; --surface-2:color-mix(in srgb,var(--a-l) 4%,#F3F6F6); --ink:#13202A; --muted:#5A6A73; --line:#D5DEE1;
  --accent:var(--a-l); --accent-ink:var(--ai-l); --accent-soft:var(--as-l);
  --owe:#B3362E; --owe-soft:#F8E0DC;
  --fest:var(--f-l); --fest-soft:var(--fs-l);
  --task:#4652A8; --task-soft:#E2E5F8;
  --shadow:0 1px 2px rgba(19,32,42,.06),0 8px 24px rgba(19,32,42,.06);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --nav-h:64px;
}
:root[data-palette="orange"]{--a-l:#C2500A; --as-l:#FCE2CF; --ai-l:#FFFFFF; --a-d:#FF8C42; --as-d:#3F2516; --ai-d:#1A0C03; --f-l:#8F6C00; --fs-l:#F6EBC2; --f-d:#E6C34E; --fs-d:#3A3111}
:root[data-palette="ocean"]{--a-l:#1D5EA8; --as-l:#DBE7F7; --ai-l:#FFFFFF; --a-d:#6CA9F2; --as-d:#162A42; --ai-d:#06111F}
:root[data-palette="plum"]{--a-l:#7A3A84; --as-l:#F0DFF2; --ai-l:#FFFFFF; --a-d:#CF8DD8; --as-d:#351F3A; --ai-d:#1A0A1D}
:root[data-palette="rose"]{--a-l:#B32F5C; --as-l:#F9DCE6; --ai-l:#FFFFFF; --a-d:#F2849F; --as-d:#3F1B27; --ai-d:#1E070E}
:root[data-palette="sun"]{--a-l:#8A6400; --as-l:#F7EBC4; --ai-l:#FFFFFF; --a-d:#F2C230; --as-d:#3A3010; --ai-d:#1A1400; --f-l:#C2500A; --fs-l:#FCE2CF; --f-d:#FF8C42; --fs-d:#3F2516}
:root[data-palette="graphite"]{--a-l:#2F3D46; --as-l:#E0E5E8; --ai-l:#FFFFFF; --a-d:#C8D3D9; --as-d:#26313A; --ai-d:#10171B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:color-mix(in srgb,var(--a-d) 5%,#0E1418); --surface:#162027; --surface-2:#1C2830; --ink:#E5ECEE; --muted:#93A4AC; --line:#2A3943;
  --accent:var(--a-d); --accent-ink:var(--ai-d); --accent-soft:var(--as-d);
  --owe:#F07A6E; --owe-soft:#3B1E1B; --fest:var(--f-d); --fest-soft:var(--fs-d); --task:#A1A9F2; --task-soft:#252A4D;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:color-mix(in srgb,var(--a-d) 5%,#0E1418); --surface:#162027; --surface-2:#1C2830; --ink:#E5ECEE; --muted:#93A4AC; --line:#2A3943;
  --accent:var(--a-d); --accent-ink:var(--ai-d); --accent-soft:var(--as-d);
  --owe:#F07A6E; --owe-soft:#3B1E1B; --fest:var(--f-d); --fest-soft:var(--fs-d); --task:#A1A9F2; --task-soft:#252A4D;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.app{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.brand{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:-.01em;margin:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.top .sp{flex:1}
.sync{cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--accent)} .sync.busy i{background:var(--fest)} .sync.err i{background:var(--owe)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}

h2.sec{font-family:var(--f-display);font-weight:600;font-size:15px;margin:22px 0 10px;display:flex;align-items:baseline;gap:8px;text-wrap:balance}
h2.sec .more{margin-left:auto;font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--accent);background:none;border:0;padding:0}
.view{display:flex;flex-direction:column}

/* Summary */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px;display:grid;gap:14px}
.hero .lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.hero .big{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,8vw,34px);line-height:1.1}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent-ink);border-radius:99px}
.hero .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;flex-wrap:wrap}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:0;text-align:left;display:grid;gap:4px;min-width:0}
.tile .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.tile .v{font-family:var(--f-mono);font-weight:600;font-size:clamp(17px,5vw,21px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile.owe .v{color:var(--owe)} .tile.owed .v{color:var(--accent)}
.tile .sub{font-size:12px;color:var(--muted)}

/* Lists */
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0;display:grid;gap:2px}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .m{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.item .amt{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.item .amt small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.item.tap{cursor:pointer}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted);font-size:14px;display:grid;gap:10px;justify-items:start}
.empty b{color:var(--ink)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.red{background:var(--owe-soft);color:var(--owe)} .chip.green{background:var(--accent-soft);color:var(--accent)}
.chip.gold{background:var(--fest-soft);color:var(--fest)} .chip.blue{background:var(--task-soft);color:var(--task)}

.date-badge{width:46px;flex:none;text-align:center;border-radius:12px;background:var(--surface-2);padding:6px 0;line-height:1.1}
.date-badge b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px}
.date-badge span{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.date-badge.fest{background:var(--fest-soft)} .date-badge.fest b{color:var(--fest)}

.check{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:14px;height:14px}
.done .t{text-decoration:line-through;color:var(--muted)}

.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--surface-2);color:var(--ink);font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:var(--owe-soft);color:var(--owe)}
.btn.pay{background:var(--accent-soft);color:var(--accent)}
.btn.paid{background:var(--accent);color:var(--accent-ink)}

.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px;box-shadow:var(--shadow);margin-top:6px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpis .tile{padding:10px 12px}
.kpis .tile .v{font-size:clamp(14px,4.2vw,17px)}

/* Calendar */
.cal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-head h3{flex:1;margin:0;font-family:var(--f-display);font-weight:600;font-size:16px;text-transform:capitalize}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase}
.day{aspect-ratio:1/1.05;max-width:100%;border:0;background:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.day.out{opacity:.35}
.day.wknd{color:var(--owe)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.hol:not(.sel){background:var(--fest-soft);color:var(--fest)}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.d-pay{background:var(--owe)} .d-task{background:var(--task)} .d-ev{background:var(--fest)}
.day.sel .dots i{background:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.fab{position:fixed;z-index:24;right:max(18px,calc(50vw - 292px),calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));height:54px;padding:0 20px 0 16px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.fab svg{width:22px;height:22px}

/* Sheet */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(8,14,18,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0 0 14px}
.form{display:grid;gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;min-height:44px;font-size:16px}
.field input[type=checkbox]{width:20px;height:20px;min-height:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline{display:flex;align-items:center;gap:10px;font-weight:600}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{flex:1;min-width:120px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios span{display:block;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:14px}
.radios input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.radios input:focus-visible+span{outline:2px solid var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.actions .grow{flex:1}
.brow{display:grid;grid-template-columns:1fr 110px 34px;gap:6px;align-items:center}
.brow input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;font-size:16px;min-width:0}
.brow button{height:34px;border:0;border-radius:9px;background:var(--surface-2);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px dashed var(--line);background:none;border-radius:99px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.total-line{display:flex;justify-content:space-between;font-weight:700;padding-top:6px;border-top:1px solid var(--line)}
.banner{background:var(--fest-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:8px}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px)}

.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.sw{border:2px solid var(--line);border-radius:14px;background:var(--surface-2);padding:10px 8px;display:grid;justify-items:center;gap:6px;font-size:12.5px;font-weight:700}
.sw i{width:28px;height:28px;border-radius:50%;display:block;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.sw.on{border-color:var(--accent);color:var(--accent)}
.codebox{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.codebox code{flex:1;min-width:0;font-family:var(--f-mono);font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-wrap:anywhere;user-select:all}
textarea.io{width:100%;min-height:120px;font-family:var(--f-mono);font-size:12px}
</style>

<div class="app">

<script>
(function(){

let FS=null,docRef=null,pushTimer=null,lastOk=0,lastErr="",cloudOn=false,cloudWhy="",lastSentJson="";
function setSync(kind,text){const el=$("#sync");el.className="sync "+kind;el.querySelector("span").textContent=text;if(kind==="ok"){lastOk=Date.now();lastErr=""}else if(kind==="err")lastErr=text;const st=$("#cloud-status");if(st)st.innerHTML=cloudStatusHtml()}
function cloudStatusHtml(){
  const t=lastOk?new Date(lastOk).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}):"";
  if(!cloudOn)return `<span class="chip red">Не подключено</span> ${esc(cloudWhy||"Подключаюсь…")}`;
  if(lastErr)return `<span class="chip red">Нет синхронизации</span> ${esc(cloudWhy||lastErr)}${t?` Последний раз всё сохранилось в ${t}.`:""}`;
  return lastOk?`<span class="chip green">Облако подключено</span> Синхронизировано в ${t}.`:`<span class="chip gold">Подключаюсь…</span>`;
}
function cacheLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function commit(){state.updatedAt=Date.now();cacheLocal();if(cloudOn){setSync("busy",navigator.onLine===false?"Сохраню, когда появится сеть":"Сохраняю…");clearTimeout(pushTimer);pushTimer=setTimeout(push,700)}render()}
function errText(e){
  const c=e&&e.code||"";
  if(c.includes("permission-denied")){cloudWhy="Firebase не пускает к данным. Проверь правила в Firestore → Rules.";return"Нет доступа"}
  if(c.includes("unavailable")){cloudWhy="Нет связи с Firebase. Изменения сохранятся, когда появится интернет.";return"Нет связи"}
  cloudWhy="Ошибка Firebase: "+(c||"неизвестная");return"Ошибка облака";
}
async function push(){
  pushTimer=null;if(!docRef)return;
  const json=JSON.stringify(state);
  if(json===lastSentJson){setSync("ok","В облаке");return}
  try{await FS.setDoc(docRef,{state:json,updatedAt:state.updatedAt||Date.now(),v:1});lastSentJson=json;cloudWhy="";setSync("ok","В облаке")}
  catch(e){setSync("err",errText(e))}
}
async function startCloud(){
  const c=CLOUD.firebase;
  if(!c.apiKey||!c.projectId){cloudWhy="В начале файла не указаны ключи Firebase. Данные хранятся только в этом браузере.";setSync("","Локально");return}
  setSync("busy","Подключаюсь…");
  try{
    const SDK="https://www.gstatic.com/firebasejs/10.12.2/";
    const [A,AU,F]=await Promise.all([import(SDK+"firebase-app.js"),import(SDK+"firebase-auth.js"),import(SDK+"firebase-firestore.js")]);
    FS=F;
    const app=A.getApps().find(x=>x.name==="svoy-schet")||A.initializeApp(c,"svoy-schet");
    await AU.signInAnonymously(AU.getAuth(app));
    let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache()})}catch(e){db=F.getFirestore(app)}
    docRef=F.doc(db,CLOUD.collection,CLOUD.space);cloudOn=true;
    F.onSnapshot(docRef,snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(!snap.exists()){if(state.updatedAt)push();else setSync("ok","В облаке");return}
      const d=snap.data();let remote;try{remote=JSON.parse(d.state)}catch(e){return}
      const ru=remote.updatedAt||0,lu=state.updatedAt||0;
      if(ru>lu){state=Object.assign(blank(),remote);lastSentJson=d.state;cacheLocal();applyLook();if(rollover())commit();else{render();setSync("ok","В облаке")}}
      else if(ru<lu){if(!pushTimer)push()}
      else{lastSentJson=d.state;setSync("ok","В облаке")}
    },e=>setSync("err",errText(e)));
  }catch(e){
    cloudOn=false;const code=e&&e.code||"";
    cloudWhy=code.includes("operation-not-allowed")||code.includes("admin-restricted")?"В Firebase выключен анонимный вход. Включи его: Authentication → Sign-in method → Anonymous.":"Не удалось подключиться к Firebase. Проверь интернет и обнови страницу.";
    setSync("err","Нет облака");
  }
}

/* ---------- payments ---------- */
const KIND={sub:"Подписка",bill:"Регулярный платёж",loan:"Оплата частями"};
const FREQ={month:"раз в месяц",week:"раз в неделю",quarter:"раз в квартал",year:"раз в год",once:"один раз"};
function nthDue(p,i){
  if(p.freq==="once")return i===0?p.start:null;
  if(p.freq==="week")return addDays(p.start,7*i);
  const s=parse(p.start),step=p.freq==="quarter"?3:p.freq==="year"?12:1;
  const mm=s.getMonth()+i*step,y=s.getFullYear()+Math.floor(mm/12),m=((mm%12)+12)%12;
  return key(new Date(y,m,Math.min(s.getDate(),dim(y,m))));
}
const maxCount=p=>p.kind==="loan"?Math.max(1,p.parts|0):p.freq==="once"?1:5000;
const isPaid=(p,o)=>(p.kind==="loan"&&o.i<(p.prePaid|0))||(p.paid||[]).includes(o.k);
const floorKey=p=>p.kind==="loan"?"0000-00-00":(p.trackFrom||p.start);
function occ(p,from,to){
  const out=[],max=maxCount(p);
  for(let i=0;i<max;i++){const k=nthDue(p,i);if(!k||k>to||(p.end&&k>p.end))break;if(k>=from)out.push({k,i})}
  return out;
}
function paidCount(p){let c=0;for(const o of occ(p,"0000-00-00","9999-12-31"))if(isPaid(p,o))c++;return c}
function nextDue(p){
  const lim=addDays(todayKey(),800),f=floorKey(p);
  for(const o of occ(p,"0000-00-00",lim)){if(o.k>=f&&!isPaid(p,o))return o}
  return null;
}
const finished=p=>!nextDue(p);
function monthlyEq(p){
  if(finished(p)||p.freq==="once")return 0;
  return p.freq==="week"?p.amount*52/12:p.freq==="quarter"?p.amount/3:p.freq==="year"?p.amount/12:p.amount;
}
function loanLeft(p){return p.kind!=="loan"?0:Math.max(0,(p.parts-paidCount(p)))*p.amount}
function monthStats(y,m){
  const from=key(new Date(y,m,1)),to=key(new Date(y,m,dim(y,m)));let total=0,paid=0,items=[];
  for(const p of state.payments){for(const o of occ(p,from,to)){if(o.k<floorKey(p))continue;total+=p.amount;const pd=isPaid(p,o);if(pd)paid+=p.amount;items.push({p,o,pd})}}
  const t=todayKey(),isCur=t>=from&&t<=to;
  for(const d of state.debts){
    if(d.dir!=="out"||!d.due)continue;
    const left=debtLeft(d),paidIn=(d.log||[]).filter(l=>l.d>=from&&l.d<=to).reduce((a,l)=>a+l.a,0);
    const dueIn=d.due>=from&&d.due<=to,overdue=isCur&&d.due<from&&left>0;
    if(dueIn||overdue){total+=left+paidIn;paid+=paidIn}
  }
  return{total,paid,items};
}
function togglePaid(id,k){
  const p=state.payments.find(x=>x.id===id);if(!p)return;p.paid=p.paid||[];
  const i=p.paid.indexOf(k);if(i>=0)p.paid.splice(i,1);else p.paid.push(k);
  commit();toast(i>=0?"Отметка снята":"Оплата отмечена");
}
function upcomingPayments(days){
  const t=todayKey(),lim=addDays(t,days),out=[];
  for(const p of state.payments){for(const o of occ(p,"0000-00-00",lim)){if(o.k<floorKey(p)||isPaid(p,o))continue;out.push({p,o})}}
  return out.sort((a,b)=>a.o.k.localeCompare(b.o.k));
}

/* ---------- debts ---------- */
const debtLeft=d=>Math.max(0,d.amount-(d.paid||0));
function debtTotals(){
  let out=0,inn=0;for(const d of state.debts){if(d.dir==="out")out+=debtLeft(d);else inn+=debtLeft(d)}
  let loans=0;for(const p of state.payments)loans+=loanLeft(p);
  return{out,inn,loans};
}

/* ---------- holidays & events ---------- */
function easter(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,m=Math.floor((d+e+114)/31),day=(d+e+114)%31+1;return new Date(y,m-1,day+13)}
function nthSunday(y,m,n){const d=new Date(y,m,1);return new Date(y,m,1+((7-d.getDay())%7)+7*(n-1))}
function holidays(y){
  const E=easter(y),T=new Date(E);T.setDate(T.getDate()+49);
  return [["newyear","Новый год",new Date(y,0,1)],["valentine","День святого Валентина",new Date(y,1,14)],["women","Международный женский день",new Date(y,2,8)],["easter","Пасха",E],["labour","День труда",new Date(y,4,1)],["remembrance","День памяти и победы",new Date(y,4,8)],["mothers","День матери",nthSunday(y,4,2)],["trinity","Троица",T],["fathers","День отца",nthSunday(y,5,3)],["constitution","День Конституции Украины",new Date(y,5,28)],["statehood","День Государственности",new Date(y,6,15)],["independence","День Независимости Украины",new Date(y,7,24)],["knowledge","День знаний",new Date(y,8,1)],["defenders","День защитников и защитниц",new Date(y,9,1)],["teachers","День учителя",nthSunday(y,9,1)],["halloween","Хэллоуин",new Date(y,9,31)],["nicholas","День святого Николая",new Date(y,11,6)],["christmas","Рождество",new Date(y,11,25)]]
  .filter(h=>!state.hiddenHol.includes(h[0])).map(([id,title,d])=>({ref:"h:"+id,hid:id,title,date:key(d),kind:"holiday"}));
}
function eventsOnYear(y){
  const out=[];
  for(const e of state.events){
    if(e.yearly){const d=parse(e.date);const m=d.getMonth();out.push({ref:"e:"+e.id,ev:e,title:e.title,date:key(new Date(y,m,Math.min(d.getDate(),dim(y,m)))),kind:e.kind||"event"})}
    else if(parse(e.date).getFullYear()===y)out.push({ref:"e:"+e.id,ev:e,title:e.title,date:e.date,kind:e.kind||"event"});
  }
  return out;
}
const occasions=y=>holidays(y).concat(eventsOnYear(y));
function budgetOf(x){const items=x.kind==="holiday"?(state.hb[x.hid]||[]):(x.ev.budget||[]);return{items,sum:items.reduce((s,i)=>s+(+i.a||0),0)}}
function upcomingOccasions(n){
  const t=todayKey(),y=new Date().getFullYear(),lim=addDays(t,366);
  return occasions(y).concat(occasions(y+1)).filter(x=>x.date>=t&&x.date<=lim).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,n);
}

/* ---------- tasks ---------- */
function rollover(){
  const t=todayKey();let ch=false;
  for(const x of state.tasks){if(!x.done&&x.date<t){x.from=x.from||x.date;x.moved=(x.moved||0)+1;x.date=t;ch=true}}
  return ch;
}

function vPay(){
  const f=ui.payFilter;
  let list=state.payments.slice();
  if(f!=="all")list=list.filter(p=>f==="done"?finished(p):p.kind===f&&!finished(p));
  else list=list.filter(p=>!finished(p));
  list.sort((a,b)=>{const na=nextDue(a),nb=nextDue(b);return (na?na.k:"9")<(nb?nb.k:"9")?-1:1});
  const monthly=state.payments.reduce((s,p)=>s+monthlyEq(p),0);
  const subs=state.payments.filter(p=>p.kind==="sub"&&!finished(p)).reduce((s,p)=>s+monthlyEq(p),0);
  const loans=state.payments.reduce((s,p)=>s+loanLeft(p),0);
  const seg=[["all","Активные"],["sub","Подписки"],["bill","Платежи"],["loan","Частями"],["done","Архив"]];
  return `
  <div class="kpis">
    <div class="tile"><span class="lbl">В месяц</span><span class="v">${money(monthly)}</span></div>

  ${list.length?`<div class="list">${list.map(p=>{
    const n=nextDue(p);const left=p.kind==="loan"?`<span>осталось ${money(loanLeft(p))}</span><span class="chip">${paidCount(p)} из ${p.parts}</span>`:`<span>${FREQ[p.freq]}</span>`;
    const over=n&&n.k<todayKey();

      <div class="m">${left}${n?`<span${over?' style="color:var(--owe)"':""}>след. ${fmtDate(n.k)}</span>`:`<span class="chip green">${p.end?"отключено":"закрыто"}</span>`}</div></div>
      <div class="amt">${money(p.amount)}</div>

  :`<div class="empty">${f==="done"?"Завершённых платежей пока нет.":"Пока ничего. Нажми «Платёж», чтобы добавить подписку, коммуналку или рассрочку."}</div>`}`;
}

function vCal(){
  const y=ui.calY,m=ui.calM,first=new Date(y,m,1),startOff=(first.getDay()+6)%7,days=dim(y,m);
  const t=todayKey();
  const from=key(new Date(y,m,1-startOff)),to=addDays(from,41);
  const occMap={},payMap={},taskMap={};
  for(const yy of [y-1,y,y+1])for(const o of occasions(yy)){if(o.date>=from&&o.date<=to)(occMap[o.date]=occMap[o.date]||[]).push(o)}
  for(const p of state.payments)for(const o of occ(p,from,to)){if(o.k>=floorKey(p))(payMap[o.k]=payMap[o.k]||[]).push({p,o})}
  for(const x of state.tasks)if(x.date>=from&&x.date<=to)(taskMap[x.date]=taskMap[x.date]||[]).push(x);
  for(const d of state.debts)if(d.due&&d.due>=from&&d.due<=to&&debtLeft(d)>0)(payMap[d.due]=payMap[d.due]||[]).push({debt:d});
  let cells="";
  const total=Math.ceil((startOff+days)/7)*7;
  for(let i=0;i<total;i++){
    const k=addDays(from,i),d=parse(k),out=d.getMonth()!==m;
    const hol=(occMap[k]||[]).some(o=>o.kind==="holiday");
    const dots=[(payMap[k]||[]).length?'<i class="d-pay"></i>':"",(taskMap[k]||[]).some(x=>!x.done)?'<i class="d-task"></i>':"",(occMap[k]||[]).length?'<i class="d-ev"></i>':""].join("");
    cells+=`<button class="day ${out?"out":""} ${[0,6].includes(d.getDay())?"wknd":""} ${k===t?"today":""} ${k===ui.calSel?"sel":""} ${hol?"hol":""}" data-act="cal-day" data-k="${k}" aria-label="${fmtDate(k)}">${d.getDate()}<span class="dots">${dots}</span></button>`;
  }
  const s=ui.calSel,so=(occasions(parse(s).getFullYear()).filter(o=>o.date===s)),sp=state.payments.flatMap(p=>occ(p,s,s).filter(o=>o.k>=floorKey(p)).map(o=>({p,o}))),st=state.tasks.filter(x=>x.date===s),sd=state.debts.filter(d=>d.due===s&&debtLeft(d)>0);
  const ups=upcomingOccasions(8);
  return `
  <div class="cal">
    <div class="cal-head"><button class="iconbtn" data-act="cal-prev" aria-label="Предыдущий месяц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h3>${MONTHS[m]} ${y}</h3>
    ${(y!==new Date().getFullYear()||m!==new Date().getMonth())?`<button class="btn sm ghost" data-act="cal-today">Сегодня</button>`:""}
    <button class="iconbtn" data-act="cal-next" aria-label="Следующий месяц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <div class="grid7">${["пн","вт","ср","чт","пт","сб","вс"].map(w=>`<div class="wd">${w}</div>`).join("")}${cells}</div>
    <div class="legend"><span><i class="d-pay"></i>оплата</span><span><i class="d-task"></i>дело</span><span><i class="d-ev"></i>праздник или событие</span></div>
  </div>
  <h2 class="sec">${s===t?"Сегодня, ":""}${fmtDateW(s)}<button class="more" data-act="add-task-on" data-k="${s}">+ дело</button></h2>
  ${so.length||sp.length||st.length||sd.length?`<div class="list">${so.map(occRow).join("")}${sp.map(x=>payRow(x.p,x.o)).join("")}${sd.map(d=>d.dir==="out"?debtDueRow(d):`<div class="item tap" data-act="edit-debt" data-id="${d.id}"><div class="main"><div class="t">Обещали вернуть: ${esc(d.who)}</div><div class="m"><span class="chip green">мне должны</span></div></div><div class="amt" style="color:var(--accent)">${money(debtLeft(d))}</div></div>`).join("")}${st.map(taskRow).join("")}</div>`:`<div class="empty">В этот день ничего не запланировано.</div>`}
  <h2 class="sec">Ближайшие праздники и события</h2>
  <div class="list">${ups.map(occRow).join("")}</div>
  ${state.hiddenHol.length?`<p class="note" style="margin-top:8px">Скрыто праздников: ${state.hiddenHol.length}. <button class="more" style="border:0;background:none;color:var(--accent);font-weight:700;padding:0" data-act="unhide">Вернуть все</button></p>`:""}`;
}
function vTasks(){
  const t=todayKey();
  const open=state.tasks.filter(x=>!x.done).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||""));
  const done=state.tasks.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,15);
  const groups={};for(const x of open)(groups[x.date]=groups[x.date]||[]).push(x);
  const moved=open.filter(x=>x.moved).length;
  return `
  ${moved?`<div class="banner"><b>${moved} ${plural(moved,"дело","дела","дел")}</b> ${plural(moved,"перенесено","перенесены","перенесено")} с прошлых дней. Закрой или запланируй заново.</div>`:""}
  ${Object.keys(groups).length?Object.entries(groups).map(([k,arr])=>`<h2 class="sec">${k===t?"Сегодня":k===addDays(t,1)?"Завтра":fmtDateW(k)}</h2><div class="list">${arr.map(taskRow).join("")}</div>`).join("")
  :`<h2 class="sec">Сегодня</h2><div class="empty">Открытых дел нет. Если не успеешь сделать дело в свой день, оно само переедет на следующий.</div>`}
  ${done.length?`<h2 class="sec">Сделано<button class="more" data-act="clear-done">Очистить</button></h2><div class="list">${done.map(taskRow).join("")}</div>`:""}`;
}

/* ---------- sheet ---------- */
let sheetSubmit=null;
function openSheet(title,body,onSubmit,after){
  $("#sheet-root").innerHTML=`<div class="backdrop" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><h3>${esc(title)}</h3><form class="form" id="sheet-form" novalidate>${body}</form></div></div>`;
  sheetSubmit=onSubmit;
  const f=$("#sheet-form");
  f.addEventListener("submit",e=>{e.preventDefault();if(sheetSubmit&&sheetSubmit(new FormData(f),f)!==false)closeSheet()});
  if(after)after(f);
  const first=f.querySelector("input:not([type=hidden]):not([type=radio]):not([type=checkbox])");if(first&&!first.value)setTimeout(()=>first.focus(),60);
}
function closeSheet(){$("#sheet-root").innerHTML="";sheetSubmit=null}
const fld=(label,html)=>`<label class="field"><span>${label}</span>${html}</label>`;
const delBtn=(act,id)=>`<button type="button" class="btn danger" data-act="${act}" data-id="${id}" data-confirm="0">Удалить</button>`;
function armDelete(btn,fn){
  if(btn.dataset.confirm!=="1"){btn.dataset.confirm="1";btn.textContent="Точно удалить?";setTimeout(()=>{if(btn.isConnected){btn.dataset.confirm="0";btn.textContent="Удалить"}},3500);return}
  fn();closeSheet();
}

function sheetRepay(d){
  const left=debtLeft(d);
  openSheet(d.dir==="out"?`Отдаю: ${d.who}`:`Возврат от: ${d.who}`,`
    <p class="note">Осталось ${money(left)} из ${money(d.amount)}.</p>
    ${fld("Сумма",`<input name="a" id="f-ra" inputmode="decimal" value="${left}">`)}
    <div class="actions"><button type="button" class="btn ghost" data-act="repay-all" data-id="${d.id}">Весь долг</button><span class="grow"></span><button class="btn pri">Записать</button></div>`,
  fd=>{const a=Math.min(left,num(fd.get("a")));if(a<=0){toast("Введи сумму");return false}
    d.paid=(d.paid||0)+a;(d.log=d.log||[]).push({d:todayKey(),a});commit();toast(debtLeft(d)<=0?"Долг закрыт":"Записано");});
}
function sheetTask(x,date){
  const isNew=!x;x=x||{title:"",date:date||todayKey(),time:""};
  openSheet(isNew?"Новое дело":"Дело",`
    ${fld("Что сделать",`<input name="title" id="f-ttitle" value="${esc(x.title)}" placeholder="Например, оплатить интернет">`)}
    <div class="two">${fld("День",`<input type="date" name="date" id="f-tdate" value="${x.date}">`)}${fld("Время",`<input type="time" name="time" id="f-ttime" value="${x.time||""}">`)}</div>
    ${x.moved?`<p class="note">Переносилось ${x.moved} ${plural(x.moved,"раз","раза","раз")}, изначально на ${fmtDate(x.from)}.</p>`:""}
    <div class="actions">${isNew?"":delBtn("del-task",x.id)}${!isNew&&!x.done?`<button type="button" class="btn ghost" data-act="task-tomorrow" data-id="${x.id}">На завтра</button>`:""}<span class="grow"></span><button class="btn pri">${isNew?"Добавить":"Сохранить"}</button></div>`,
  fd=>{const title=String(fd.get("title")).trim();if(!title){toast("Напиши, что сделать");return false}
    const o=isNew?{id:uid(),done:false,moved:0}:state.tasks.find(t=>t.id===x.id);
    const nd=fd.get("date")||todayKey();if(!isNew&&nd!==o.date){o.moved=0;o.from=null}
    Object.assign(o,{title,date:nd,time:fd.get("time")||""});
    if(isNew)state.tasks.push(o);rollover();commit();toast(isNew?"Дело добавлено":"Сохранено");});
}
const QUICK=["Подарки","Праздничный стол","Напитки","Украшения","Одежда","Поездка","Развлечения"];
function budgetEditor(items){
  return `<div class="field"><span>Примерные траты</span><div id="brows" style="display:grid;gap:6px">${(items.length?items:[{n:"",a:""}]).map(bRow).join("")}</div>
  <div class="chips" style="margin-top:6px">${QUICK.map(q=>`<button type="button" data-act="bquick" data-n="${q}">+ ${q}</button>`).join("")}</div>
  <div class="total-line" style="margin-top:6px"><span>Итого</span><span class="num" id="btotal"></span></div><p class="note" id="bsave"></p></div>`;
}
const bRow=i=>`<div class="brow"><input name="bn" placeholder="Статья" value="${esc(i.n)}" aria-label="Статья расходов"><input name="ba" inputmode="decimal" placeholder="0" value="${i.a===""?"":i.a}" aria-label="Сумма"><button type="button" data-act="bdel" aria-label="Убрать строку">✕</button></div>`;
function readBudget(fd){const n=fd.getAll("bn"),a=fd.getAll("ba"),out=[];n.forEach((x,i)=>{x=String(x).trim();const v=num(a[i]);if(x||v)out.push({n:x||"Прочее",a:v})});return out}
function wireBudget(f,date){
  const upd=()=>{const items=readBudget(new FormData(f)),s=items.reduce((t,i)=>t+i.a,0);$("#btotal").textContent=money(s);
    const d=date?diffDays(todayKey(),typeof date==="function"?date():date):0,w=Math.ceil(d/7);
    $("#bsave").textContent=s&&w>1?`До даты ${d} ${plural(d,"день","дня","дней")}: откладывай по ${money(s/w)} в неделю или ${money(s/Math.max(1,Math.ceil(d/30)))} в месяц.`:"";};
  f.addEventListener("input",upd);f.addEventListener("change",upd);f._bupd=upd;upd();
}
function sheetOcc(ref,date){
  if(ref.startsWith("h:")){
    const hid=ref.slice(2),h=holidays(parse(date).getFullYear()).find(x=>x.hid===hid);
    openSheet(h?h.title:"Праздник",`<p class="note">${fmtDateW(date)}, ${relDay(date)}. Бюджет сохраняется для этого праздника и в следующие годы.</p>${budgetEditor(state.hb[hid]||[])}
      <div class="actions"><button type="button" class="btn ghost" data-act="hide-hol" data-id="${hid}">Скрыть праздник</button><span class="grow"></span><button class="btn pri">Сохранить</button></div>`,
    fd=>{const b=readBudget(fd);if(b.length)state.hb[hid]=b;else delete state.hb[hid];commit();toast("Бюджет сохранён")},f=>wireBudget(f,date));
  }else sheetEvent(state.events.find(e=>"e:"+e.id===ref),null,date);
}
function sheetEvent(e,date,occDate){
  const isNew=!e;e=e||{title:"",date:date||todayKey(),kind:"event",yearly:false,budget:[]};
  openSheet(isNew?"Новое событие":"Событие",`
    <div class="radios"><label><input type="radio" name="kind" value="event" ${e.kind!=="birthday"?"checked":""}><span>Событие</span></label><label><input type="radio" name="kind" value="birthday" ${e.kind==="birthday"?"checked":""}><span>День рождения</span></label></div>
    ${fld("Название",`<input name="title" id="f-etitle" value="${esc(e.title)}" placeholder="Например, ДР мамы или свадьба друга">`)}
    ${fld("Дата",`<input type="date" name="date" id="f-edate" value="${e.date}">`)}
    <label class="inline"><input type="checkbox" name="yearly" id="f-eyear" ${e.yearly?"checked":""} style="width:20px;height:20px"> Каждый год</label>
    ${budgetEditor(e.budget||[])}
    <div class="actions">${isNew?"":delBtn("del-event",e.id)}<span class="grow"></span><button class="btn pri">${isNew?"Добавить":"Сохранить"}</button></div>`,
  fd=>{const title=String(fd.get("title")).trim();if(!title){toast("Напиши название");return false}
    const o=isNew?{id:uid()}:state.events.find(x=>x.id===e.id);
    Object.assign(o,{title,date:fd.get("date")||todayKey(),kind:fd.get("kind"),yearly:!!fd.get("yearly"),budget:readBudget(fd)});
    if(isNew)state.events.push(o);commit();toast(isNew?"Событие добавлено":"Сохранено");},
  f=>{f.querySelector("[name=kind]").form.addEventListener("change",ev=>{if(ev.target.name==="kind"&&ev.target.value==="birthday")$("#f-eyear").checked=true});
    wireBudget(f,()=>{const d=$("#f-edate").value||todayKey();if(!$("#f-eyear").checked)return d;const dd=parse(d),y=new Date().getFullYear();let k=key(new Date(y,dd.getMonth(),dd.getDate()));if(k<todayKey())k=key(new Date(y+1,dd.getMonth(),dd.getDate()));return k});});
}
function sheetAddChooser(){
  openSheet("Что добавить?",`<div class="list" style="box-shadow:none;border:1px solid var(--line)">
    ${[["new-pay","Платёж","подписка, регулярная оплата, рассрочка"],["new-debt","Долг","кому должна ты или кто должен тебе"],["new-event","Событие","день рождения, праздник, поездка"],["new-task","Дело","задача на день"]].map(([a,t,m])=>`<button type="button" class="item tap" style="width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left" data-act="${a}"><div class="main"><div class="t">${t}</div><div class="m">${m}</div></div></button>`).join("")}</div>`,()=>{});
}
function sheetSettings(){
  const L=state.look||{};
  openSheet("Настройки",`
    <div class="field"><span>Цветовая тема</span><div class="swatches">${PALETTES.map(([k,l,c])=>`<button type="button" class="sw ${(L.palette||"emerald")===k?"on":""}" data-act="pal" data-p="${k}"><i style="background:${c}"></i>${l}</button>`).join("")}</div></div>
    <div class="field"><span>Оформление</span><div class="seg" style="margin:0;box-shadow:none;border:1px solid var(--line)">${MODES.map(([k,l])=>`<button type="button" class="${(L.mode||"auto")===k?"on":""}" data-act="mode" data-m="${k}">${l}</button>`).join("")}</div></div>
    ${fld("Валюта",`<select name="cur" id="f-cur">${["₴","$","€","zł","£"].map(c=>`<option ${state.currency===c?"selected":""}>${c}</option>`).join("")}</select>`)}
    <div class="field"><span>Облако</span><p class="note" id="cloud-status" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">${cloudStatusHtml()}</p>${cloudOn?`<p class="note">Каждое изменение сразу сохраняется в Firebase и появляется на всех устройствах, где открыто это приложение.</p>`:""}</div>
    ${canInstall()?`<div class="field"><span>Приложение</span><div class="actions" style="margin:0"><button type="button" class="btn" data-act="install">Установить на устройство</button></div></div>`:""}
    <div class="field"><span>Резервная копия</span><div class="actions" style="margin:0"><button type="button" class="btn" data-act="export">Сохранить файл</button><label class="btn" style="cursor:pointer">Загрузить файл<input type="file" accept=".json,application/json" id="f-import" hidden></label></div></div>
    <div class="field"><span>Данные</span><div class="actions" style="margin:0"><button type="button" class="btn ghost" data-act="demo">Заполнить примером</button><button type="button" class="btn danger" data-act="reset" data-confirm="0">Стереть всё</button></div></div>
    <div class="actions"><span class="grow"></span><button class="btn pri">Готово</button></div>`,
  fd=>{const c=fd.get("cur");if(c!==state.currency){state.currency=c;commit()}},
  f=>{$("#f-import").addEventListener("change",ev=>{const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.payments))throw 0;state=Object.assign(blank(),d);applyLook();rollover();commit();closeSheet();toast("Данные загружены")}catch(e){toast("Это не файл «Своего счёта»")}};r.readAsText(file)})});
}
async function exportData(){
  const data=JSON.stringify(state,null,2),name=`svoy-schet-${todayKey()}.json`;
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename:name,data});toast("Файл сохранён");return}}catch(e){if(e&&e.code==="declined")return;}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Файл сохранён")}catch(e){toast("Не получилось сохранить файл")}
}
function demo(){
  const t=todayKey(),d=parse(t),y=d.getFullYear(),m=d.getMonth();
  const day=n=>key(new Date(y,m,Math.min(n,dim(y,m))));
  const tf=addDays(t,-40);
  state.payments.push(
    {id:uid(),kind:"sub",name:"Пример: Netflix",amount:299,freq:"month",start:day(5),paid:[day(5)],trackFrom:tf,note:""},
    {id:uid(),kind:"sub",name:"Пример: облако для фото",amount:89,freq:"month",start:day(18),paid:[],trackFrom:tf,note:""},
    {id:uid(),kind:"bill",name:"Пример: коммунальные",amount:2400,freq:"month",start:day(20),paid:[],trackFrom:tf,note:""},
    {id:uid(),kind:"bill",name:"Пример: страховка авто",amount:5200,freq:"year",start:addDays(t,9),paid:[],trackFrom:tf,note:""},
    {id:uid(),kind:"loan",name:"Пример: телефон частями",amount:1650,freq:"month",start:key(new Date(y,m-3,12)),parts:10,prePaid:3,paid:[],trackFrom:tf,note:""});
  state.debts.push(
    {id:uid(),dir:"out",who:"Пример: Сергей",amount:3000,paid:1000,due:addDays(t,20),note:"на ремонт",log:[{d:addDays(t,-6),a:1000}]},
    {id:uid(),dir:"in",who:"Пример: Аня",amount:800,paid:0,due:addDays(t,5),note:"билеты в кино",log:[]});
  state.events.push({id:uid(),title:"Пример: день рождения мамы",date:addDays(t,24),kind:"birthday",yearly:true,budget:[{n:"Подарок",a:2500},{n:"Цветы",a:600}]});
  state.tasks.push({id:uid(),title:"Пример: позвонить в банк",date:addDays(t,-1),done:false,moved:0},{id:uid(),title:"Пример: купить продукты",date:t,done:false,moved:0,time:"18:30"});
  if(!state.hb.newyear)state.hb.newyear=[{n:"Подарки",a:4000},{n:"Праздничный стол",a:3500}];
  rollover();commit();toast("Добавлены примеры, их можно удалить");
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const navb=e.target.closest(".nav button");
  if(navb){ui.tab=navb.dataset.tab;try{sessionStorage.setItem(LS+"-tab",ui.tab)}catch(_){}render();window.scrollTo({top:0});return}
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==="close-bg"){if(e.target===el)closeSheet();return}
  switch(a){
    case "fab":({home:sheetAddChooser,pay:()=>sheetPay(),debts:()=>sheetDebt(null,ui.debtFilter),cal:()=>sheetEvent(null,ui.calSel),tasks:()=>sheetTask()})[ui.tab]();break;
    case "new-pay":sheetPay();break;case "new-debt":sheetDebt();break;case "new-event":sheetEvent(null,todayKey());break;case "new-task":sheetTask();break;
    case "settings":sheetSettings();break;
    case "goto":ui.tab=el.dataset.tab;if(el.dataset.f)ui.debtFilter=el.dataset.f;render();window.scrollTo({top:0});break;
    case "toggle-paid":togglePaid(id,el.dataset.k);break;
    case "edit-pay":sheetPay(state.payments.find(x=>x.id===id));break;
    case "del-pay":armDelete(el,()=>{state.payments=state.payments.filter(x=>x.id!==id);commit();toast("Платёж удалён")});break;
    case "end-pay":{const p=state.payments.find(x=>x.id===id);p.end=todayKey();commit();closeSheet();toast("Платёж отключён");break}
    case "resume-pay":{const p=state.payments.find(x=>x.id===id);delete p.end;p.trackFrom=todayKey();commit();closeSheet();toast("Платёж возобновлён");break}
    case "payf":ui.payFilter=el.dataset.f;render();break;
    case "debtf":ui.debtFilter=el.dataset.f;render();break;
    case "edit-debt":sheetDebt(state.debts.find(x=>x.id===id));break;
    case "repay":sheetRepay(state.debts.find(x=>x.id===id));break;
    case "repay-all":{const d=state.debts.find(x=>x.id===id),l=debtLeft(d);d.paid=d.amount;(d.log=d.log||[]).push({d:todayKey(),a:l});commit();closeSheet();toast("Долг закрыт");break}
    case "del-debt":armDelete(el,()=>{state.debts=state.debts.filter(x=>x.id!==id);commit();toast("Долг удалён")});break;
    case "toggle-task":{const x=state.tasks.find(t=>t.id===id);x.done=!x.done;x.doneAt=x.done?Date.now():0;if(!x.done)rollover();commit();break}
    case "edit-task":sheetTask(state.tasks.find(t=>t.id===id));break;
    case "add-task-on":sheetTask(null,el.dataset.k);break;
    case "task-tomorrow":{const x=state.tasks.find(t=>t.id===id);x.from=x.from||x.date;x.moved=(x.moved||0)+1;x.date=addDays(todayKey(),1);commit();closeSheet();toast("Перенесено на завтра");break}
    case "del-task":armDelete(el,()=>{state.tasks=state.tasks.filter(x=>x.id!==id);commit();toast("Дело удалено")});break;
    case "clear-done":state.tasks=state.tasks.filter(x=>!x.done);commit();break;
    case "occ":sheetOcc(el.dataset.ref,el.dataset.date);break;
    case "del-event":armDelete(el,()=>{state.events=state.events.filter(x=>x.id!==id);commit();toast("Событие удалено")});break;
    case "hide-hol":state.hiddenHol.push(id);commit();closeSheet();toast("Праздник скрыт");break;
    case "unhide":state.hiddenHol=[];commit();break;
    case "cal-prev":ui.calM--;if(ui.calM<0){ui.calM=11;ui.calY--}render();break;
    case "cal-next":ui.calM++;if(ui.calM>11){ui.calM=0;ui.calY++}render();break;
    case "cal-today":{const n=new Date();ui.calY=n.getFullYear();ui.calM=n.getMonth();ui.calSel=todayKey();render();break}
    case "cal-day":{ui.calSel=el.dataset.k;const d=parse(ui.calSel);ui.calY=d.getFullYear();ui.calM=d.getMonth();render();break}
    case "bquick":{const rows=$("#brows");const tmp=document.createElement("div");tmp.innerHTML=bRow({n:el.dataset.n,a:""});const empty=[...rows.querySelectorAll(".brow")].find(r=>!r.querySelector("[name=bn]").value&&!r.querySelector("[name=ba]").value);if(empty)empty.replaceWith(tmp.firstChild);else rows.appendChild(tmp.firstChild);const last=[...rows.querySelectorAll(".brow")].find(r=>r.querySelector("[name=bn]").value===el.dataset.n&&!r.querySelector("[name=ba]").value);if(last)last.querySelector("[name=ba]").focus();break}
    case "bdel":{const r=el.closest(".brow"),rows=$("#brows");if(rows.querySelectorAll(".brow").length>1)r.remove();else r.querySelectorAll("input").forEach(i=>i.value="");const f=$("#sheet-form");if(f&&f._bupd)f._bupd();break}
    case "export":exportData();break;
    case "pal":{state.look=Object.assign({},state.look,{palette:el.dataset.p});applyLook();commit();document.querySelectorAll(".sw").forEach(b=>b.classList.toggle("on",b===el));break}
    case "mode":{state.look=Object.assign({},state.look,{mode:el.dataset.m});applyLook();commit();el.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===el));break}
    case "close-sheet":closeSheet();break;
    case "install":closeSheet();doInstall();break;
    case "install-hide":try{localStorage.setItem(LS+"-noinstall","1")}catch(_){}render();toast("Установить можно в Настройках");break;
    case "demo":closeSheet();demo();break;
    case "reset":armDelete(el,()=>{const c=state.currency,lk=state.look;state=blank();state.currency=c;state.look=lk;commit();toast("Все данные стёрты")});break;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheet-root").innerHTML)closeSheet()});

let toastT;function toast(msg){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200)}

/* day change watcher: tasks roll over at midnight */
let lastDay=todayKey();
setInterval(()=>{const t=todayKey();if(t!==lastDay){lastDay=t;if(rollover())commit();else render()}},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const t=todayKey();if(t!==lastDay){lastDay=t;if(rollover())commit();else render()}}});

if(rollover())commit();else render();
startCloud();
if("serviceWorker" in navigator&&canInstall())navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body></html>
